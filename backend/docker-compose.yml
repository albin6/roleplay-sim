services:
  postgres:
    image: postgres:16-alpine
    container_name: roleplay_postgres
    environment:
      POSTGRES_USER: roleplay
      POSTGRES_PASSWORD: roleplay_pass
      POSTGRES_DB: roleplay_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roleplay -d roleplay_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: roleplay_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: roleplay_network
